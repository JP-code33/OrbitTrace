<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>orbittrace</title>
  </head>
  <body>

    <div id="orbitTraceLoadingScreen">
      <div class="orbitTraceLoadingContent">
        <h1>OrbitTrace</h1>
        <p>Initializing System...</p>
      </div>
      <div class="orbitTraceLoadingBar">
        <div id="loadingProgress"></div>
      </div>
      <span id="loadingPercent">0%</span>
    </div>

    <div class="orbitTraceSatelliteSearch">
      <input type="text" id="orbitTraceSatelliteSearchInput" placeholder="Search Satellites">
    </div>

    <div id="satelliteInfoPanel">
      <div class="satelliteInfoHeader">
        <h2>Satellite Info</h2>
      </div>

      <div class="satelliteInfoContent">
        <h3 id="satelliteName">Satellite</h3>

        <div class="satelliteInfoRow">
          <span>Norad Id</span>
          <strong id="satelliteNoradId">--</strong>
        </div>

        <div class="satelliteInfoRow">
          <span>Latitude</span>
          <strong id="satelliteLatitude"></strong>
        </div>

        <div class="satelliteInfoRow">
          <span>Longitude</span>
          <strong id="satelliteLongitude"></strong>
        </div>

        <div class="satelliteInfoRow">
          <span>Altitude</span>
          <strong id="satelliteAltitude"></strong>
        </div>
      </div>
    </div>  

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
